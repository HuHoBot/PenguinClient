config-version: 11

# 服务器显示名称，可在进服/退服格式中通过 {server} 使用。
serverName: "HuHoBot"

# 独立 WebUI：/huhobot webui 创建出站通道，网页直接显示一次性验证码，用 /huhobot webui <验证码> 确认。
# 不开放管理端口；远程站点必须使用 HTTPS。本机开发地址默认对应 EdgeOne CLI。
webui:
  enabled: true
  url: "http://127.0.0.1:8088"

# 只检查并提示新版本，不下载、安装或替换插件。
update-check:
  enabled: true
  # 自定义 HTTP(S) 数据源，逗号分隔；留空查询 HuHoBot/PenguinClient GitHub Releases。
  url: ""

bot:
  # QQ 机器人凭据。任一留空时启动后会在控制台输出二维码，
  # 用手机 QQ 扫码即可自动填写这两项并重新连接。
  app-id: ""
  secret: ""
  name: "HuHoBot"
  groups: []
  # 收到新群消息时自动把群 OpenID 加入 groups；不主动扫描群列表。
  auto-add-groups: true
  # 屏蔽 io.github.kloping.qqbot 直接通过 System.out 输出的调试信息。
  suppress-console-output: true

chat-format:
  from-game: "[游戏] {message}"
  from-group: "[QQ] {name}: {message}"
  post-chat: true
  # 只有以该内容开头的游戏消息才会转发；转发时会移除该内容。留空表示全部转发。
  start-with: "#"

player-events:
  # false：遵循平台事件状态（如隐藏进退服消息）；true：始终转发。
  always-forward: false
  join:
    enabled: true
    # 可用占位符：{name}、{player}、{server}、{platform}
    format: "[游戏] {name} 加入了服务器"
  quit:
    enabled: true
    # 可用占位符：{name}、{player}、{server}、{platform}
    format: "[游戏] {name} 离开了服务器"

# 服务器状态通知：关机、重启、意外关闭时提醒 QQ 群。
server-notify:
  enabled: true
  shutdown:
    enabled: true
    message: "服务器已正常关闭"
  restart:
    enabled: true
    message: "服务器已重启完成"
  crash:
    enabled: true
    message: "服务器意外关闭（崩溃或被强制结束），请管理员检查控制台"
  # 上次正常停止后多少秒内再次启动算作重启；意外关闭不受此窗口影响。
  restart-window: 180

# 配置键对应插件数据目录 Markdown/ 下的文件。
markdown:
  queryOnline: "online.md"
  motd: "motd.md"

# Hybrid 同时收集命令发送者输出和服务端日志；其他值只收集命令发送者输出。
command-sender: "Hybrid"

motd:
  server-ip: "127.0.0.1"
  server-port: 25565
  api: ""
  text: ""
  post-img: false
  use-markdown: false

whitelist:
  add-command: "whitelist add {name}"
  del-command: "whitelist remove {name}"

filter-regex: []

admin:
  # qq: 仅群主/QQ 群管理员；config: 仅手动名单；both: 任一满足
  mode: both
  openids: []

features:
  # 是否启用 QQ 头像认证功能。
  enable-auth: true
  full-amount: false
  # 是否订阅群成员进退群与入群申请事件（GROUP_MEMBER_EVENT）。
  # 需要 QQ 机器人具备群管理相关权限，订阅失败会导致连接被拒，默认关闭；修改后需重启服务器生效。
  group-member-events: false

command-panel:
  # 是否在 QQ 面板展示管理员命令；不会改变命令实际执行权限。
  show-admin-commands: true

command-blacklist: []
# priority 为 0–999，数值越小越靠前；同优先级公开命令优先。
# 指令面板最多 20 项，内置命令和自定义命令统一排序。
commands:
  版本:
    enable: true
    pushMenu: true
    priority: 0
  查信息:
    enable: true
    pushMenu: true
  查管理:
    enable: true
    pushMenu: true
  加管理:
    enable: true
    pushMenu: true
  删管理:
    enable: true
    pushMenu: true
  管理方式:
    enable: true
    pushMenu: true
  添加白名单:
    enable: true
    pushMenu: true
  删除白名单:
    enable: true
    pushMenu: true
  查白名单:
    enable: true
    pushMenu: true
  查在线:
    enable: true
    pushMenu: true
  在线服务器:
    enable: true
    pushMenu: true
  motd:
    enable: true
    pushMenu: true
  发信息:
    enable: true
    pushMenu: true
  执行命令:
    enable: true
    pushMenu: true
  执行:
    enable: true
    pushMenu: true
  管理员执行:
    enable: true
    pushMenu: true
  全量:
    enable: true
    pushMenu: true
  blockMotd:
    enable: true
    pushMenu: false
  unblockMotd:
    enable: true
    pushMenu: false
  认证:
    enable: true
    pushMenu: true
  帮助:
    enable: true
    pushMenu: true

audit:
  # 本地 sensitive-words/*.txt 命中后才调用 OpenAI 兼容接口二审
  # 接口不可用时自动采用本地屏蔽结果
  base-url: ""
  api-key: ""
  model: "gpt-4o-mini"

# /执行 <key> [参数]：仅 permission=0
# /管理员执行 <key> [参数]：可执行全部权限等级
# 占位符：{params}、{group}、{user}、{0}、{1}...，并兼容 &1、&2...
custom-commands:
  # - key: "公告"
  #   command: "say {params}"
  #   permission: 1
  #   pushMenu: true
